[project]
name = "agentic-video"
version = "0.1.0"
description = "An agentic AI video generation pipeline orchestrated with LangGraph."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]